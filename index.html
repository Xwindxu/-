<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>部门排班表（自动合并班次）</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
    margin: 16px;
    color: #222;
    background: #f7f9fb;
  }
  h2 { text-align: center; margin: 0 0 14px; }
  .panel {
    background: #fff;
    border-radius: 10px;
    padding: 16px 18px 20px;
    box-shadow: 0 2px 10px rgba(0,0,0,.06);
    max-width: 1700px;
    margin: 0 auto;
  }
  .info {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    align-items: center;
    font-size: 14px;
    margin-bottom: 14px;
  }
  .info label { color: #555; }
  .info span[contenteditable] {
    display: inline-block;
    min-width: 90px;
    border-bottom: 1px solid #bbb;
    padding: 2px 6px;
  }
  input[type="month"], select {
    padding: 4px 6px;
    border: 1px solid #bbb;
    border-radius: 4px;
    font-size: 14px;
    font-family: inherit;
  }
  .week-nav { display: inline-flex; align-items: center; gap: 6px; }
  .week-nav button { padding: 3px 9px; font-size: 13px; }

  .table-wrap { overflow-x: auto; border-radius: 6px; }
  table.schedule {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
    min-width: 1420px;
  }
  table.schedule th, table.schedule td {
    border: 1px solid #ccd4dd;
    text-align: center;
    padding: 4px 2px;
    font-size: 13px;
  }
  table.schedule th { background: #eef3f8; font-weight: 600; }
  table.schedule thead tr:nth-child(2) th {
    background: #f5f8fb;
    font-size: 12px;
    font-weight: 500;
    color: #556;
    padding: 4px 2px;
  }
  .date-sub {
    font-size: 11px;
    color: #888;
    font-weight: normal;
    margin-top: 2px;
  }
  .name-col { width: 96px; }
  .am-wage-col, .pm-wage-col, .ot-wage-col { width: 78px; }
  .salary-col { width: 100px; }
  .op-col { width: 54px; }
  .shift-col { width: 92px; }
  .ot-col { width: 54px; background: #fffaf0; }

  /* 班次单元格 */
  .shift-cell {
    padding: 3px 3px;
    vertical-align: middle;
    text-align: center;
  }
  .shift-cell .shift-select {
    width: 100%;
    height: 30px;
    border: 1px solid #e5ecf3;
    border-radius: 4px;
    background-color: #fff;
    font-size: 13px;
    font-family: inherit;
    font-weight: 600;
    color: #222;
    text-align: center;
    text-align-last: center;
    cursor: pointer;
    outline: none;
    padding: 0 16px 0 2px;
    -webkit-appearance: none;
    appearance: none;
    background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 6'%3e%3cpath fill='%236b7783' d='M0 0l5 6 5-6z'/%3e%3c/svg%3e");
    background-repeat: no-repeat;
    background-position: right 4px center;
    background-size: 7px 5px;
    transition: border-color .15s, background-color .15s;
  }
  .shift-cell .shift-select:hover {
    border-color: #a8c5e8;
    background-color: #f5fbff;
  }
  .shift-cell .shift-select:focus {
    border-color: #1a73e8;
    box-shadow: 0 0 0 2px rgba(26,115,232,.18);
    background-color: #fffbe6;
  }
  .shift-cell .shift-select[data-filled="true"] {
    background-color: #e8f0fe;
    border-color: #a8c5e8;
    color: #1a5fb4;
  }
  .shift-cell .shift-select[data-filled="true"][data-rest="true"] {
    background-color: #f4f5f7;
    border-color: #dde3ea;
    color: #7a8694;
    font-weight: 500;
  }
  .shift-cell .shift-select.split-hint {
    color: #6b7783;
    font-weight: 500;
  }

  .shift-split {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }
  .shift-half-row {
    display: flex;
    align-items: center;
    gap: 3px;
  }
  .shift-half-label {
    font-size: 10px;
    color: #9aa5b0;
    width: 12px;
    flex: 0 0 auto;
    text-align: center;
    font-weight: 600;
  }
  .shift-cell .shift-select.half {
    flex: 1;
    min-width: 0;
    height: 26px;
    font-size: 12px;
    padding: 0 12px 0 2px;
    background-position: right 2px center;
    background-size: 6px 4px;
  }

  /* 加班下拉 */
  .ot-cell {
    padding: 3px 2px;
    vertical-align: middle;
    text-align: center;
  }
  .ot-select {
    width: 100%;
    height: 30px;
    border: 1px solid #f0dcb0;
    border-radius: 4px;
    background-color: #fffaf0;
    font-size: 13px;
    font-family: inherit;
    font-weight: 600;
    color: #b06a00;
    text-align: center;
    text-align-last: center;
    cursor: pointer;
    outline: none;
    padding: 0 14px 0 2px;
    -webkit-appearance: none;
    appearance: none;
    background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 6'%3e%3cpath fill='%23b06a00' d='M0 0l5 6 5-6z'/%3e%3c/svg%3e");
    background-repeat: no-repeat;
    background-position: right 3px center;
    background-size: 7px 5px;
    transition: border-color .15s, background-color .15s;
  }
  .ot-select:hover { background-color: #fff3d6; }
  .ot-select:focus {
    border-color: #1a73e8;
    box-shadow: 0 0 0 2px rgba(26,115,232,.18);
    background-color: #fffbe6;
  }

  td.out { background: #f2f4f6; }

  .wage-input, .ot-input {
    width: 68px;
    padding: 5px 4px;
    border: 1px solid #c4ccd4;
    border-radius: 4px;
    font-size: 13px;
    font-family: inherit;
    text-align: right;
    background: #fff;
    color: #c0392b;
    font-weight: 600;
    outline: none;
  }
  .wage-input:focus, .ot-input:focus {
    border-color: #1a73e8;
    box-shadow: 0 0 0 2px rgba(26,115,232,.18);
    background: #fffbe6;
  }
  .ot-input { color: #b06a00; border-color: #e2c690; background: #fffaf0; }

  .staff-name {
    display: inline-block;
    padding: 2px 6px;
    color: #1a73e8;
    cursor: pointer;
    border-bottom: 1px dashed #1a73e8;
  }
  .staff-name:hover { background: #e8f0fe; border-radius: 4px; }
  .salary-val { color: #c0392b; font-weight: 600; }
  .salary-val.empty { color: #bbb; font-weight: normal; }

  .toolbar { margin-top: 14px; }
  button {
    padding: 7px 14px;
    margin-right: 8px;
    cursor: pointer;
    border: 1px solid #c4ccd4;
    background: #fff;
    border-radius: 6px;
    font-size: 14px;
    font-family: inherit;
  }
  button:hover { background: #f0f4f8; }
  .btn-del { color: #c0392b; border-color: #e6b3ad; padding: 4px 8px; font-size: 12px; }
  .note { margin-top: 14px; font-size: 13px; color: #666; line-height: 1.8; }
  .note code {
    background: #eef3f8;
    padding: 1px 5px;
    border-radius: 3px;
    color: #1a5fb4;
    font-family: Consolas, Menlo, monospace;
  }

  /* 弹窗 */
  .modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.45);
    z-index: 100;
    justify-content: center;
    align-items: flex-start;
    padding: 40px 20px;
    overflow: auto;
  }
  .modal.show { display: flex; }
  .modal-box {
    background: #fff;
    border-radius: 10px;
    width: 100%;
    max-width: 1000px;
    padding: 20px 22px 24px;
    box-shadow: 0 12px 34px rgba(0,0,0,.25);
  }
  .modal-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #e5e9ee;
    padding-bottom: 10px;
    margin-bottom: 12px;
  }
  .modal-head h3 { margin: 0; font-size: 17px; }
  .modal-name {
    font-size: 14px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 14px;
  }
  .modal-name input[type="text"] {
    padding: 5px 8px;
    border: 1px solid #bbb;
    border-radius: 4px;
    font-size: 14px;
    width: 130px;
    font-family: inherit;
  }
  .modal-name input[type="number"] {
    padding: 5px 8px;
    border: 1px solid #bbb;
    border-radius: 4px;
    font-size: 14px;
    width: 80px;
    text-align: right;
    color: #c0392b;
    font-weight: 600;
    font-family: inherit;
    outline: none;
  }
  .modal-name input[type="number"]:focus {
    border-color: #1a73e8;
    box-shadow: 0 0 0 2px rgba(26,115,232,.18);
  }

  .week-head {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    font-size: 12px;
    color: #666;
    text-align: center;
    margin-bottom: 6px;
    margin-top: 8px;
  }
  .month-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
  }
  .day-cell {
    border: 1px solid #dde3ea;
    border-radius: 6px;
    padding: 4px 4px 5px;
    min-height: 96px;
    display: flex;
    flex-direction: column;
    background: #fcfdfe;
  }
  .day-num {
    font-size: 11px;
    color: #7a8694;
    display: flex;
    justify-content: space-between;
    padding: 0 2px;
    margin-bottom: 4px;
  }
  .day-num .wd { color: #a9b3bd; }
  .day-cell .half-row {
    display: flex;
    align-items: center;
    gap: 4px;
    margin-bottom: 3px;
  }
  .day-cell .half-label {
    font-size: 11px;
    color: #9aa5b0;
    width: 16px;
    text-align: center;
    flex: 0 0 auto;
    font-weight: 600;
  }
  .day-cell .half-label.ot { color: #b06a00; }
  .day-cell .day-select {
    flex: 1;
    width: 100%;
    height: 26px;
    border: 1px solid #e5ecf3;
    border-radius: 4px;
    background-color: #fff;
    font-size: 12px;
    font-family: inherit;
    font-weight: 600;
    color: #222;
    text-align: center;
    text-align-last: center;
    cursor: pointer;
    outline: none;
    padding: 0 12px 0 2px;
    -webkit-appearance: none;
    appearance: none;
    background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 6'%3e%3cpath fill='%236b7783' d='M0 0l5 6 5-6z'/%3e%3c/svg%3e");
    background-repeat: no-repeat;
    background-position: right 2px center;
    background-size: 6px 4px;
  }
  .day-cell .day-select:focus {
    border-color: #1a73e8;
    box-shadow: 0 0 0 2px rgba(26,115,232,.18);
    background-color: #fffbe6;
  }
  .day-cell .day-select.ot {
    color: #b06a00;
    background-color: #fffaf0;
    border-color: #f0dcb0;
  }
  .day-cell .day-select[data-filled="true"] {
    background-color: #e8f0fe;
    border-color: #a8c5e8;
    color: #1a5fb4;
  }
  .day-cell .day-select[data-filled="true"][data-rest="true"] {
    background-color: #f4f5f7;
    border-color: #dde3ea;
    color: #7a8694;
    font-weight: 500;
  }
  .day-cell.empty { border: none; background: transparent; }

  .salary-detail {
    margin-top: 18px;
    padding-top: 14px;
    border-top: 1px dashed #dde3ea;
  }
  .salary-detail h4 {
    margin: 0 0 10px;
    font-size: 15px;
    color: #1a5fb4;
  }
  table.salary-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }
  table.salary-table td {
    padding: 7px 10px;
    border-bottom: 1px solid #eef2f7;
  }
  table.salary-table td:nth-child(2) { text-align: right; }
  table.salary-table td:nth-child(3) { text-align: right; }
  table.salary-table tr.total-row td {
    border-top: 2px solid #1a73e8;
    border-bottom: none;
    font-weight: 700;
    color: #c0392b;
    font-size: 15px;
    padding-top: 10px;
  }
  .salary-detail .hint-line {
    font-size: 13px;
    color: #888;
    margin-bottom: 8px;
    line-height: 1.6;
  }

  @media print {
    @page { size: A3 landscape; margin: 8mm; }
    body { margin: 0; background: #fff; }
    .panel { box-shadow: none; padding: 0; border-radius: 0; max-width: none; }
    .no-print, .toolbar, .modal { display: none !important; }
    .table-wrap { overflow: visible; }
    table.schedule { min-width: 100%; }
    th, td { border: 1px solid #000; font-size: 10px; padding: 2px; }
    .wage-input, .ot-input, .shift-select, .ot-select, .day-select {
      border: none !important; background: transparent !important;
      color: #000 !important; font-weight: 600;
      -webkit-appearance: none; appearance: none;
      background-image: none !important;
    }
  }
</style>
</head>
<body>

<div class="panel">
  <h2 contenteditable="true">部门工作排班表</h2>

  <div class="info">
    <span><label>部门：</label><span contenteditable="true">综合部</span></span>
    <span><label>月份：</label><input type="month" id="monthPicker"></span>
    <span class="week-nav">
      <label>周次：</label>
      <button type="button" id="prevWeek">上一周</button>
      <select id="weekPicker"></select>
      <button type="button" id="nextWeek">下一周</button>
    </span>
    <span><label>制表人：</label><span contenteditable="true">张三</span></span>
  </div>

  <div class="table-wrap">
    <table class="schedule" id="scheduleTable">
      <thead>
        <tr id="dateRow1"></tr>
        <tr id="dateRow2"></tr>
      </thead>
      <tbody id="staffBody"></tbody>
    </table>
  </div>

  <div class="toolbar no-print">
    <button onclick="addStaff()">＋ 添加员工</button>
    <button onclick="window.print()">打印 / 导出PDF</button>
    <button onclick="clearAll()">清空全部数据</button>
  </div>

  <div class="note">
    <b>使用说明：</b><br>
    · 每天分 <b>班次</b> 和 <b>加班</b> 两栏；<br>
    · 班次栏里如果上午、下午填的<b>一样</b>，会自动<b>合并成一个格子</b>显示（例如全天 C1）；<br>
    · 如果上午、下午要不一样，在班次下拉里选 <code>分开填写…</code>，就会拆成"上"、"下"两行；<br>
    · 拆开后如果改成同一个值，会自动合并回去；<br>
    · 加班格可选 <code>0.5h</code>、<code>1h</code>、<code>1.5h</code>、<code>2h</code>、<code>2.5h</code>、<code>3h</code>、<code>4h</code>；<br>
    · 默认每位员工：上午 80 元 / 下午 70 元 / 加班 20 元每小时，可在姓名右侧输入框直接改。
  </div>
</div>

<div class="modal" id="modal">
  <div class="modal-box">
    <div class="modal-head">
      <h3>员工整月班次与薪资</h3>
      <button onclick="closeModal()">关闭</button>
    </div>
    <div class="modal-name">
      <label>姓名：</label><input type="text" id="modalName">
      <label>上午单价：</label><input type="number" id="modalAmWage" min="0" step="1">
      <label>下午单价：</label><input type="number" id="modalPmWage" min="0" step="1">
      <label>加班单价：</label><input type="number" id="modalOtWage" min="0" step="1">
      <span style="color:#888;font-size:13px;">元（加班为元/小时）</span>
    </div>

    <div class="week-head">
      <div>周一</div><div>周二</div><div>周三</div><div>周四</div>
      <div>周五</div><div>周六</div><div>周日</div>
    </div>
    <div class="month-grid" id="monthGrid"></div>

    <div class="salary-detail" id="salaryDetail"></div>
  </div>
</div>

<script>
const WEEK_FULL = ['周一','周二','周三','周四','周五','周六','周日'];
const WEEK_SHORT = ['一','二','三','四','五','六','日'];
const STORAGE_KEY = 'deptScheduleV12';

/* 下拉选项 */
const SHIFT_OPTIONS = ['', 'C1', 'C2', '正常', 'A1', '休', '请假'];
const SHIFT_LABELS = { '': '—', 'C1': 'C1', 'C2': 'C2', '正常': '正常', 'A1': 'A1', '休': '休', '请假': '请假' };
const OT_OPTIONS = ['', '0.5', '1', '1.5', '2', '2.5', '3', '4'];

let state = loadState();
let currentStaffId = null;
/* 记录被手动拆分的日期：key = "staffId-date" */
const forcedSplitDays = new Set();

/* ---------- 工具 ---------- */
function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
}
function currentMonthStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}
function numOr(v, dft) {
  const n = Number(v);
  return isNaN(n) ? dft : n;
}
function normalizeStaff(s) {
  if (!s.days) s.days = {};
  s.amWage = numOr(s.amWage, 80);
  s.pmWage = numOr(s.pmWage, 70);
  s.otWage = numOr(s.otWage, 20);
  return s;
}
function newStaffDefaults(name) {
  return normalizeStaff({
    id: uid(),
    name: name || '新员工',
    days: {},
    amWage: 80,
    pmWage: 70,
    otWage: 20
  });
}
function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const s = JSON.parse(raw);
      if (s && Array.isArray(s.staff)) {
        s.staff = s.staff.map(normalizeStaff);
        return s;
      }
    }
  } catch (e) {}
  return {
    month: currentMonthStr(),
    week: 0,
    staff: [
      newStaffDefaults('张三'),
      newStaffDefaults('李四'),
      newStaffDefaults('王五')
    ]
  };
}
function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
}
function getMonthInfo() {
  const [y, m] = state.month.split('-').map(Number);
  const daysInMonth = new Date(y, m, 0).getDate();
  const firstWeekday = new Date(y, m - 1, 1).getDay();
  const offset = (firstWeekday + 6) % 7;
  const totalWeeks = Math.ceil((offset + daysInMonth) / 7);
  return { y, m, daysInMonth, offset, totalWeeks };
}
function findStaff(id) {
  return state.staff.find(s => String(s.id) === String(id));
}
function dateOfWeek(week, d) {
  const { daysInMonth, offset } = getMonthInfo();
  const date = week * 7 + d + 1 - offset;
  return (date >= 1 && date <= daysInMonth) ? date : 0;
}
function formatDays(n) {
  const r = Math.round(n * 100) / 100;
  if (Number.isInteger(r)) return String(r);
  return r.toFixed(2).replace(/\.?0+$/, '');
}
function formatMoney(n) {
  const rounded = Math.round(n * 100) / 100;
  if (Number.isInteger(rounded)) return String(rounded);
  return rounded.toFixed(2);
}
function isRestValue(v) {
  if (!v) return false;
  return v.indexOf('休') !== -1 || v.indexOf('假') !== -1;
}
function isPresent(value) {
  if (!value) return false;
  const v = String(value).trim();
  if (!v) return false;
  if (isRestValue(v)) return false;
  return true;
}
function parseOT(value) {
  if (value === undefined || value === null) return 0;
  const v = String(value).trim();
  if (!v) return 0;
  if (isRestValue(v)) return 0;
  const n = Number(v);
  if (isNaN(n) || n < 0) return 0;
  return Math.round(n * 100) / 100;
}

/* ---------- 薪资计算 ---------- */
function calcSalary(staff) {
  let amCount = 0, pmCount = 0, otHours = 0;
  const map = staff.days || {};
  Object.keys(map).forEach(key => {
    const v = map[key];
    if (key.endsWith('-ot')) otHours += parseOT(v);
    else if (key.endsWith('-am')) { if (isPresent(v)) amCount++; }
    else if (key.endsWith('-pm')) { if (isPresent(v)) pmCount++; }
  });
  otHours = Math.round(otHours * 100) / 100;

  const amWage = Number(staff.amWage) || 0;
  const pmWage = Number(staff.pmWage) || 0;
  const otWage = Number(staff.otWage) || 0;

  const amAmt = Math.round(amCount * amWage * 100) / 100;
  const pmAmt = Math.round(pmCount * pmWage * 100) / 100;
  const otAmt = Math.round(otHours * otWage * 100) / 100;
  const total = Math.round((amAmt + pmAmt + otAmt) * 100) / 100;
  const days = (amCount + pmCount) / 2;
  return { amCount, pmCount, otHours, amWage, pmWage, otWage, amAmt, pmAmt, otAmt, total, days };
}

/* ---------- 下拉选项填充 ---------- */
function fillShiftOptions(sel, currentValue, includeSplit) {
  SHIFT_OPTIONS.forEach(opt => {
    const o = document.createElement('option');
    o.value = opt;
    o.textContent = SHIFT_LABELS[opt] || opt;
    sel.appendChild(o);
  });
  if (includeSplit) {
    const sep = document.createElement('option');
    sep.disabled = true;
    sep.textContent = '─────';
    sel.appendChild(sep);
    const sp = document.createElement('option');
    sp.value = '__split__';
    sp.textContent = '分开填写…';
    sel.appendChild(sp);
  }
  if (currentValue && SHIFT_OPTIONS.indexOf(currentValue) === -1) {
    const o = document.createElement('option');
    o.value = currentValue;
    o.textContent = currentValue;
    sel.appendChild(o);
  }
  sel.value = currentValue || '';
}
function fillOTOptions(sel, currentValue) {
  OT_OPTIONS.forEach(opt => {
    const o = document.createElement('option');
    o.value = opt;
    o.textContent = opt === '' ? '—' : opt + 'h';
    sel.appendChild(o);
  });
  if (currentValue && OT_OPTIONS.indexOf(currentValue) === -1) {
    const o = document.createElement('option');
    o.value = currentValue;
    o.textContent = currentValue + 'h';
    sel.appendChild(o);
  }
  sel.value = currentValue || '';
}
function applyShiftSelectStyle(sel, value) {
  if (value) sel.setAttribute('data-filled', 'true');
  else sel.removeAttribute('data-filled');
  if (isRestValue(value)) sel.setAttribute('data-rest', 'true');
  else sel.removeAttribute('data-rest');
}

/* ---------- 主表：班次单元格（合并 / 拆分） ---------- */
function renderShiftCell(s, date) {
  const td = document.createElement('td');
  td.className = 'shift-cell';
  td.dataset.staffId = s.id;
  td.dataset.date = String(date);

  const amVal = s.days[date + '-am'] || '';
  const pmVal = s.days[date + '-pm'] || '';
  const splitKey = s.id + '-' + date;
  const forcedSplit = forcedSplitDays.has(splitKey);

  // 如果没被强制拆分，且上下一样，则合并
  const canMerge = !forcedSplit && amVal === pmVal;

  if (canMerge) {
    const sel = document.createElement('select');
    sel.className = 'shift-select';
    sel.dataset.role = 'all';
    sel.dataset.staffId = s.id;
    sel.dataset.date = String(date);
    fillShiftOptions(sel, amVal, true);
    applyShiftSelectStyle(sel, amVal);
    td.appendChild(sel);
  } else {
    const wrap = document.createElement('div');
    wrap.className = 'shift-split';

    ['am', 'pm'].forEach(part => {
      const row = document.createElement('div');
      row.className = 'shift-half-row';

      const label = document.createElement('span');
      label.className = 'shift-half-label';
      label.textContent = part === 'am' ? '上' : '下';

      const sel = document.createElement('select');
      sel.className = 'shift-select half';
      sel.dataset.role = part;
      sel.dataset.staffId = s.id;
      sel.dataset.date = String(date);
      const val = s.days[date + '-' + part] || '';
      fillShiftOptions(sel, val, false);
      applyShiftSelectStyle(sel, val);

      row.appendChild(label);
      row.appendChild(sel);
      wrap.appendChild(row);
    });

    td.appendChild(wrap);
  }
  return td;
}

/* ---------- 主表：加班单元格 ---------- */
function renderOTCell(s, date) {
  const td = document.createElement('td');
  td.className = 'ot-cell';

  const sel = document.createElement('select');
  sel.className = 'ot-select';
  sel.dataset.role = 'ot';
  sel.dataset.staffId = s.id;
  sel.dataset.date = String(date);
  fillOTOptions(sel, s.days[date + '-ot'] || '');
  td.appendChild(sel);
  return td;
}

/* ---------- 表头 ---------- */
function renderWeekPicker() {
  const { totalWeeks } = getMonthInfo();
  const sel = document.getElementById('weekPicker');
  sel.innerHTML = '';
  for (let w = 0; w < totalWeeks; w++) {
    let start = 1, end = 1;
    for (let d = 0; d < 7; d++) { const x = dateOfWeek(w, d); if (x) { start = x; break; } }
    for (let d = 6; d >= 0; d--) { const x = dateOfWeek(w, d); if (x) { end = x; break; } }
    const opt = document.createElement('option');
    opt.value = w;
    opt.textContent = `第${w + 1}周（${start}日 - ${end}日）`;
    sel.appendChild(opt);
  }
  if (state.week < 0) state.week = 0;
  if (state.week >= totalWeeks) state.week = totalWeeks - 1;
  sel.value = state.week;
}

function renderHeader() {
  const row1 = document.getElementById('dateRow1');
  const row2 = document.getElementById('dateRow2');
  row1.innerHTML = '';
  row2.innerHTML = '';

  const nameTh = document.createElement('th');
  nameTh.className = 'name-col';
  nameTh.rowSpan = 2;
  nameTh.textContent = '员工姓名';
  row1.appendChild(nameTh);

  const amWageTh = document.createElement('th');
  amWageTh.className = 'am-wage-col';
  amWageTh.rowSpan = 2;
  amWageTh.innerHTML = '上午单价<div class="date-sub">元/半天</div>';
  row1.appendChild(amWageTh);

  const pmWageTh = document.createElement('th');
  pmWageTh.className = 'pm-wage-col';
  pmWageTh.rowSpan = 2;
  pmWageTh.innerHTML = '下午单价<div class="date-sub">元/半天</div>';
  row1.appendChild(pmWageTh);

  const otWageTh = document.createElement('th');
  otWageTh.className = 'ot-wage-col';
  otWageTh.rowSpan = 2;
  otWageTh.innerHTML = '加班单价<div class="date-sub">元/小时</div>';
  row1.appendChild(otWageTh);

  for (let d = 0; d < 7; d++) {
    const date = dateOfWeek(state.week, d);
    const dayTh = document.createElement('th');
    dayTh.colSpan = 2;
    dayTh.innerHTML = WEEK_FULL[d] +
      '<div class="date-sub">' + (date ? date + '日' : '—') + '</div>';
    if (!date) dayTh.classList.add('out');
    row1.appendChild(dayTh);

    const shiftTh = document.createElement('th');
    shiftTh.className = 'shift-col';
    shiftTh.textContent = '班次';
    row2.appendChild(shiftTh);

    const otTh = document.createElement('th');
    otTh.className = 'ot-col';
    otTh.textContent = '加班';
    row2.appendChild(otTh);
  }

  const salaryTh = document.createElement('th');
  salaryTh.className = 'salary-col';
  salaryTh.rowSpan = 2;
  salaryTh.textContent = '本月薪资';
  row1.appendChild(salaryTh);

  const opTh = document.createElement('th');
  opTh.className = 'op-col no-print';
  opTh.rowSpan = 2;
  opTh.textContent = '操作';
  row1.appendChild(opTh);
}

/* ---------- 主表内容 ---------- */
function renderBody() {
  const tbody = document.getElementById('staffBody');
  tbody.innerHTML = '';

  state.staff.forEach(s => {
    normalizeStaff(s);
    const tr = document.createElement('tr');

    // 姓名
    const nameTd = document.createElement('td');
    nameTd.className = 'name-col';
    const nameSpan = document.createElement('span');
    nameSpan.className = 'staff-name';
    nameSpan.dataset.staffId = s.id;
    nameSpan.title = '点击查看整月班次和薪资';
    nameSpan.textContent = s.name;
    nameSpan.addEventListener('click', () => openModal(s.id));
    nameTd.appendChild(nameSpan);
    tr.appendChild(nameTd);

    // 上午单价
    tr.appendChild(makeWageTd(s.id, 'am', s.amWage, '该员工上午半天工资', 'wage-input'));
    // 下午单价
    tr.appendChild(makeWageTd(s.id, 'pm', s.pmWage, '该员工下午半天工资', 'wage-input'));
    // 加班单价
    tr.appendChild(makeWageTd(s.id, 'ot', s.otWage, '该员工加班每小时工资', 'ot-input'));

    // 一周 7 天
    for (let d = 0; d < 7; d++) {
      const date = dateOfWeek(state.week, d);
      if (date > 0) {
        tr.appendChild(renderShiftCell(s, date));
        tr.appendChild(renderOTCell(s, date));
      } else {
        const td1 = document.createElement('td');
        td1.className = 'shift-col out';
        const td2 = document.createElement('td');
        td2.className = 'ot-col out';
        tr.appendChild(td1);
        tr.appendChild(td2);
      }
    }

    // 本月薪资
    const salaryTd = document.createElement('td');
    salaryTd.className = 'salary-col';
    const { total } = calcSalary(s);
    if (total > 0) {
      salaryTd.innerHTML = `<span class="salary-val" data-staff-id="${s.id}">¥${formatMoney(total)}</span>`;
    } else {
      salaryTd.innerHTML = `<span class="salary-val empty" data-staff-id="${s.id}">—</span>`;
    }
    tr.appendChild(salaryTd);

    // 操作
    const opTd = document.createElement('td');
    opTd.className = 'op-col no-print';
    const delBtn = document.createElement('button');
    delBtn.className = 'btn-del';
    delBtn.textContent = '删除';
    delBtn.addEventListener('click', () => deleteStaff(s.id));
    opTd.appendChild(delBtn);
    tr.appendChild(opTd);

    tbody.appendChild(tr);
  });
}

function makeWageTd(staffId, part, value, tip, cls) {
  const td = document.createElement('td');
  td.className = part === 'ot' ? 'ot-wage-col' : (part === 'am' ? 'am-wage-col' : 'pm-wage-col');
  const input = document.createElement('input');
  input.type = 'number';
  input.min = '0';
  input.step = '1';
  input.className = cls;
  input.dataset.staffId = staffId;
  input.dataset.wagePart = part;
  input.value = value;
  input.title = tip;
  td.appendChild(input);
  return td;
}

function renderAll() {
  renderWeekPicker();
  renderHeader();
  renderBody();
}

function updateSalaryCell(staffId) {
  const s = findStaff(staffId);
  if (!s) return;
  const { total } = calcSalary(s);
  const cell = document.querySelector(`.salary-val[data-staff-id="${s.id}"]`);
  if (!cell) return;
  if (total > 0) {
    cell.textContent = '¥' + formatMoney(total);
    cell.classList.remove('empty');
  } else {
    cell.textContent = '—';
    cell.classList.add('empty');
  }
}

/* ---------- 重新渲染单个班次格（用于合并/拆分切换） ---------- */
function rerenderShiftCell(staffId, date) {
  const s = findStaff(staffId);
  if (!s) return;
  const oldTd = document.querySelector(
    `#staffBody td.shift-cell[data-staff-id="${staffId}"][data-date="${date}"]`
  );
  if (!oldTd) return;
  oldTd.replaceWith(renderShiftCell(s, date));
}

/* ---------- 写入数据 ---------- */
function setDayField(staffId, date, part, value) {
  const s = findStaff(staffId);
  if (!s) return;
  const key = date + '-' + part;
  if (!s.days) s.days = {};
  if (value) s.days[key] = value;
  else delete s.days[key];
  save();
}

/* 同步弹窗里对应格子 */
function syncModalCell(staffId, date) {
  if (String(currentStaffId) !== String(staffId)) return;
  const s = findStaff(staffId);
  if (!s) return;
  // 弹窗整体重绘该员工月视图
  renderMonthGrid(s);
  renderSalaryDetail(s);
}

/* ---------- 主表：change 事件（班次 / 加班） ---------- */
document.getElementById('staffBody').addEventListener('change', e => {
  const sel = e.target;
  if (!sel.matches('select[data-role]')) return;

  const staffId = sel.dataset.staffId;
  const date = sel.dataset.date;
  const role = sel.dataset.role;
  const value = sel.value;
  const splitKey = staffId + '-' + date;

  if (value === '__split__') {
    // 用户选择"分开填写"
    forcedSplitDays.add(splitKey);
    rerenderShiftCell(staffId, date);
    return;
  }

  if (role === 'all') {
    setDayField(staffId, date, 'am', value);
    setDayField(staffId, date, 'pm', value);
    applyShiftSelectStyle(sel, value);
  } else if (role === 'am' || role === 'pm') {
    setDayField(staffId, date, role, value);
    applyShiftSelectStyle(sel, value);

    // 检查是否上下已一致 → 自动合并
    const s = findStaff(staffId);
    const amVal = s.days[date + '-am'] || '';
    const pmVal = s.days[date + '-pm'] || '';
    if (amVal === pmVal) {
      forcedSplitDays.delete(splitKey);
      rerenderShiftCell(staffId, date);
    }
  } else if (role === 'ot') {
    setDayField(staffId, date, 'ot', value);
  }

  updateSalaryCell(staffId);
  syncModalCell(staffId, date);
});

/* ---------- 主表：单价输入框 ---------- */
document.getElementById('staffBody').addEventListener('input', e => {
  const input = e.target.closest ? e.target.closest('.wage-input, .ot-input') : null;
  if (!input) return;
  const s = findStaff(input.dataset.staffId);
  if (!s) return;
  const part = input.dataset.wagePart;
  const val = Math.max(0, Number(input.value) || 0);
  if (part === 'am') s.amWage = val;
  else if (part === 'pm') s.pmWage = val;
  else if (part === 'ot') s.otWage = val;
  save();
  updateSalaryCell(s.id);
  if (String(currentStaffId) === String(s.id)) {
    syncModalWageInputs(s);
    renderSalaryDetail(s);
  }
});

/* ---------- 弹窗 ---------- */
function openModal(staffId) {
  const s = findStaff(staffId);
  if (!s) return;
  normalizeStaff(s);
  currentStaffId = s.id;

  document.getElementById('modalName').value = s.name;
  syncModalWageInputs(s);

  renderMonthGrid(s);
  renderSalaryDetail(s);
  document.getElementById('modal').classList.add('show');
}
function closeModal() {
  document.getElementById('modal').classList.remove('show');
  currentStaffId = null;
}
function syncModalWageInputs(s) {
  document.getElementById('modalAmWage').value = s.amWage;
  document.getElementById('modalPmWage').value = s.pmWage;
  document.getElementById('modalOtWage').value = s.otWage;
}

function renderMonthGrid(s) {
  const { y, m, daysInMonth, offset } = getMonthInfo();
  const grid = document.getElementById('monthGrid');
  grid.innerHTML = '';

  for (let i = 0; i < offset; i++) {
    const ph = document.createElement('div');
    ph.className = 'day-cell empty';
    grid.appendChild(ph);
  }
  for (let d = 1; d <= daysInMonth; d++) {
    const wd = (new Date(y, m - 1, d).getDay() + 6) % 7;
    const cell = document.createElement('div');
    cell.className = 'day-cell';

    const num = document.createElement('div');
    num.className = 'day-num';
    num.innerHTML = `<span>${d}日</span><span class="wd">${WEEK_SHORT[wd]}</span>`;
    cell.appendChild(num);

    const amVal = s.days[d + '-am'] || '';
    const pmVal = s.days[d + '-pm'] || '';
    const splitKey = s.id + '-' + d;
    const forcedSplit = forcedSplitDays.has(splitKey);
    const canMerge = !forcedSplit && amVal === pmVal;

    if (canMerge) {
      const row = document.createElement('div');
      row.className = 'half-row';

      const label = document.createElement('span');
      label.className = 'half-label';
      label.textContent = '班';

      const sel = document.createElement('select');
      sel.className = 'day-select';
      sel.dataset.key = d + '-all';
      sel.dataset.role = 'all';
      fillShiftOptions(sel, amVal, true);
      applyShiftSelectStyle(sel, amVal);

      row.appendChild(label);
      row.appendChild(sel);
      cell.appendChild(row);
    } else {
      ['am', 'pm'].forEach(part => {
        const row = document.createElement('div');
        row.className = 'half-row';

        const label = document.createElement('span');
        label.className = 'half-label';
        label.textContent = part === 'am' ? '上' : '下';

        const sel = document.createElement('select');
        sel.className = 'day-select';
        sel.dataset.key = d + '-' + part;
        sel.dataset.role = part;
        const val = s.days[d + '-' + part] || '';
        fillShiftOptions(sel, val, false);
        applyShiftSelectStyle(sel, val);

        row.appendChild(label);
        row.appendChild(sel);
        cell.appendChild(row);
      });
    }

    // 加班
    const otRow = document.createElement('div');
    otRow.className = 'half-row';
    const otLabel = document.createElement('span');
    otLabel.className = 'half-label ot';
    otLabel.textContent = '加';
    const otSel = document.createElement('select');
    otSel.className = 'day-select ot';
    otSel.dataset.key = d + '-ot';
    otSel.dataset.role = 'ot';
    fillOTOptions(otSel, s.days[d + '-ot'] || '');
    otRow.appendChild(otLabel);
    otRow.appendChild(otSel);
    cell.appendChild(otRow);

    grid.appendChild(cell);
  }
}

function renderSalaryDetail(s) {
  const r = calcSalary(s);
  let html = '<h4>本月薪资明细</h4>';
  html += '<div class="hint-line">'
        + '上午次数 × 上午单价 + 下午次数 × 下午单价 + 加班小时 × 加班单价；'
        + '“休”“请假”或空不计。'
        + '</div>';
  html += '<table class="salary-table">';
  html += `<tr><td>上午出勤</td><td>${r.amCount} 次</td><td>× ¥${formatMoney(r.amWage)} = ¥${formatMoney(r.amAmt)}</td></tr>`;
  html += `<tr><td>下午出勤</td><td>${r.pmCount} 次</td><td>× ¥${formatMoney(r.pmWage)} = ¥${formatMoney(r.pmAmt)}</td></tr>`;
  html += `<tr><td>加班时长</td><td>${formatDays(r.otHours)} 小时</td><td>× ¥${formatMoney(r.otWage)} = ¥${formatMoney(r.otAmt)}</td></tr>`;
  html += `<tr><td>折合天数</td><td>${formatDays(r.days)} 天</td><td></td></tr>`;
  html += `<tr class="total-row"><td>本月合计</td><td>¥${formatMoney(r.total)}</td><td></td></tr>`;
  html += '</table>';
  document.getElementById('salaryDetail').innerHTML = html;
}

/* 弹窗里的下拉 change */
document.getElementById('monthGrid').addEventListener('change', e => {
  const sel = e.target.closest ? e.target.closest('select[data-role]') : null;
  if (!sel || !currentStaffId) return;
  const s = findStaff(currentStaffId);
  if (!s) return;

  const role = sel.dataset.role;
  const key = sel.dataset.key;
  const parts = key.split('-');
  const date = parts[0];
  const splitKey = s.id + '-' + date;
  const value = sel.value;

  if (value === '__split__') {
    forcedSplitDays.add(splitKey);
    renderMonthGrid(s);
    rerenderShiftCell(s.id, date);
    return;
  }

  if (role === 'all') {
    setDayField(s.id, date, 'am', value);
    setDayField(s.id, date, 'pm', value);
  } else if (role === 'am' || role === 'pm') {
    setDayField(s.id, date, role, value);
  } else if (role === 'ot') {
    setDayField(s.id, date, 'ot', value);
  }

  // 检查是否自动合并
  const amVal = s.days[date + '-am'] || '';
  const pmVal = s.days[date + '-pm'] || '';
  if (role !== 'ot' && amVal === pmVal) {
    forcedSplitDays.delete(splitKey);
  }

  // 重绘弹窗和主表对应的格
  renderMonthGrid(s);
  rerenderShiftCell(s.id, date);
  renderSalaryDetail(s);
  updateSalaryCell(s.id);
});

document.getElementById('modalName').addEventListener('input', e => {
  const s = findStaff(currentStaffId);
  if (!s) return;
  s.name = e.target.value;
  save();
  const el = document.querySelector(`.staff-name[data-staff-id="${s.id}"]`);
  if (el) el.textContent = s.name;
});

function bindModalWage(inputId, field, part) {
  document.getElementById(inputId).addEventListener('input', e => {
    const s = findStaff(currentStaffId);
    if (!s) return;
    const val = Math.max(0, Number(e.target.value) || 0);
    s[field] = val;
    save();
    const input = document.querySelector(
      `.wage-input[data-staff-id="${s.id}"][data-wage-part="${part}"],` +
      `.ot-input[data-staff-id="${s.id}"][data-wage-part="${part}"]`
    );
    if (input) input.value = val;
    renderSalaryDetail(s);
    updateSalaryCell(s.id);
  });
}
bindModalWage('modalAmWage', 'amWage', 'am');
bindModalWage('modalPmWage', 'pmWage', 'pm');
bindModalWage('modalOtWage', 'otWage', 'ot');

document.getElementById('modal').addEventListener('click', e => {
  if (e.target.id === 'modal') closeModal();
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

/* ---------- 员工增删 ---------- */
function addStaff() {
  const name = prompt('请输入员工姓名：', '新员工');
  if (name === null) return;
  const amStr = prompt('请输入该员工上午半天工资（元）：', '80');
  const pmStr = prompt('请输入该员工下午半天工资（元）：', '70');
  const otStr = prompt('请输入该员工加班单价（元/小时）：', '20');
  const s = newStaffDefaults(name.trim() || '新员工');
  s.amWage = Math.max(0, Number(amStr) || 0);
  s.pmWage = Math.max(0, Number(pmStr) || 0);
  s.otWage = Math.max(0, Number(otStr) || 0);
  state.staff.push(s);
  save();
  renderBody();
}
function deleteStaff(id) {
  const s = findStaff(id);
  if (!s) return;
  if (!confirm(`确定删除「${s.name}」及其整月排班数据吗？`)) return;
  state.staff = state.staff.filter(x => String(x.id) !== String(id));
  save();
  // 清理拆分状态
  Array.from(forcedSplitDays).forEach(k => {
    if (k.startsWith(String(id) + '-')) forcedSplitDays.delete(k);
  });
  renderBody();
  if (String(currentStaffId) === String(id)) closeModal();
}
function clearAll() {
  if (!confirm('确定清空全部员工和排班数据吗？此操作不可恢复。')) return;
  state.staff = [];
  state.week = 0;
  forcedSplitDays.clear();
  save();
  renderAll();
}

/* ---------- 月份 / 周次 ---------- */
document.getElementById('monthPicker').addEventListener('change', e => {
  state.month = e.target.value || currentMonthStr();
  state.week = 0;
  save();
  renderAll();
});
document.getElementById('weekPicker').addEventListener('change', e => {
  state.week = Number(e.target.value) || 0;
  save();
  renderHeader();
  renderBody();
});
document.getElementById('prevWeek').addEventListener('click', () => {
  if (state.week > 0) { state.week -= 1; save(); renderAll(); }
});
document.getElementById('nextWeek').addEventListener('click', () => {
  const { totalWeeks } = getMonthInfo();
  if (state.week < totalWeeks - 1) { state.week += 1; save(); renderAll(); }
});

/* ---------- 启动 ---------- */
document.getElementById('monthPicker').value = state.month;
renderAll();
</script>
