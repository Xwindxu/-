<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>部门排班表</title>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif; margin: 16px; color: #222; background: #f7f9fb; }
  h2 { text-align: center; margin: 0 0 14px; }
  .panel { background: #fff; border-radius: 10px; padding: 16px 18px 20px; box-shadow: 0 2px 10px rgba(0,0,0,.06); max-width: 1700px; margin: 0 auto; }
  .info { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; font-size: 14px; margin-bottom: 14px; }
  .info label { color: #555; }
  .info span[contenteditable] { display: inline-block; min-width: 90px; border-bottom: 1px solid #bbb; padding: 2px 6px; }
  input[type="month"], select, input[type="text"], input[type="password"], input[type="number"] { padding: 4px 6px; border: 1px solid #bbb; border-radius: 4px; font-size: 14px; font-family: inherit; }
  .week-nav { display: inline-flex; align-items: center; gap: 6px; }
  .week-nav button { padding: 3px 9px; font-size: 13px; }

  .table-wrap { overflow-x: auto; border-radius: 6px; }
  table.schedule { width: 100%; border-collapse: collapse; table-layout: fixed; min-width: 1420px; }
  table.schedule th, table.schedule td { border: 1px solid #ccd4dd; text-align: center; padding: 4px 2px; font-size: 13px; }
  table.schedule th { background: #eef3f8; font-weight: 600; }
  table.schedule thead tr:nth-child(2) th { background: #f5f8fb; font-size: 12px; font-weight: 500; color: #556; padding: 4px 2px; }
  .date-sub { font-size: 11px; color: #888; font-weight: normal; margin-top: 2px; }
  .name-col { width: 96px; } .am-wage-col, .pm-wage-col, .ot-wage-col { width: 78px; }
  .salary-col { width: 100px; } .op-col { width: 54px; } .shift-col { width: 92px; } .ot-col { width: 54px; background: #fffaf0; }
  .shift-cell { padding: 3px 3px; vertical-align: middle; text-align: center; }
  .shift-select { width: 100%; height: 30px; border: 1px solid #e5ecf3; border-radius: 4px; background-color: #fff; font-size: 13px; font-family: inherit; font-weight: 600; color: #222; text-align: center; text-align-last: center; cursor: pointer; outline: none; padding: 0 16px 0 2px; -webkit-appearance: none; appearance: none; background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 6'%3e%3cpath fill='%236b7783' d='M0 0l5 6 5-6z'/%3e%3c/svg%3e"); background-repeat: no-repeat; background-position: right 4px center; background-size: 7px 5px; }
  .shift-select:hover { border-color: #a8c5e8; background-color: #f5fbff; }
  .shift-select:focus { border-color: #1a73e8; box-shadow: 0 0 0 2px rgba(26,115,232,.18); background-color: #fffbe6; }
  .shift-select[data-filled="true"] { background-color: #e8f0fe; border-color: #a8c5e8; color: #1a5fb4; }
  .shift-select[data-filled="true"][data-rest="true"] { background-color: #f4f5f7; border-color: #dde3ea; color: #7a8694; font-weight: 500; }
  .shift-split { display: flex; flex-direction: column; gap: 3px; }
  .shift-half-row { display: flex; align-items: center; gap: 3px; }
  .shift-half-label { font-size: 10px; color: #9aa5b0; width: 12px; flex: 0 0 auto; text-align: center; font-weight: 600; }
  .shift-select.half { flex: 1; min-width: 0; height: 26px; font-size: 12px; padding: 0 12px 0 2px; background-position: right 2px center; background-size: 6px 4px; }
  .ot-cell { padding: 3px 2px; vertical-align: middle; text-align: center; }
  .ot-select { width: 100%; height: 30px; border: 1px solid #f0dcb0; border-radius: 4px; background-color: #fffaf0; font-size: 13px; font-family: inherit; font-weight: 600; color: #b06a00; text-align: center; text-align-last: center; cursor: pointer; outline: none; padding: 0 14px 0 2px; -webkit-appearance: none; appearance: none; background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 6'%3e%3cpath fill='%23b06a00' d='M0 0l5 6 5-6z'/%3e%3c/svg%3e"); background-repeat: no-repeat; background-position: right 3px center; background-size: 7px 5px; }
  .ot-select:hover { background-color: #fff3d6; }
  .ot-select:focus { border-color: #1a73e8; box-shadow: 0 0 0 2px rgba(26,115,232,.18); }
  td.out { background: #f2f4f6; }
  .wage-input, .ot-input { width: 68px; padding: 5px 4px; border: 1px solid #c4ccd4; border-radius: 4px; font-size: 13px; font-family: inherit; text-align: right; background: #fff; color: #c0392b; font-weight: 600; outline: none; }
  .wage-input:focus, .ot-input:focus { border-color: #1a73e8; box-shadow: 0 0 0 2px rgba(26,115,232,.18); background: #fffbe6; }
  .ot-input { color: #b06a00; border-color: #e2c690; background: #fffaf0; }
  .staff-name { display: inline-block; padding: 2px 6px; color: #1a73e8; cursor: pointer; border-bottom: 1px dashed #1a73e8; }
  .staff-name:hover { background: #e8f0fe; border-radius: 4px; }
  .salary-val { color: #c0392b; font-weight: 600; }
  .salary-val.empty { color: #bbb; font-weight: normal; }
  .toolbar { margin-top: 14px; display: flex; flex-wrap: wrap; gap: 8px; }
  button { padding: 7px 14px; cursor: pointer; border: 1px solid #c4ccd4; background: #fff; border-radius: 6px; font-size: 14px; font-family: inherit; }
  button:hover { background: #f0f4f8; }
  button.primary { background: #1a73e8; border-color: #1a73e8; color: #fff; }
  button.primary:hover { background: #1558b8; }
  button.danger { background: #c0392b; border-color: #c0392b; color: #fff; }
  button.danger:hover { background: #a53125; }
  .btn-del { color: #c0392b; border-color: #e6b3ad; padding: 4px 8px; font-size: 12px; }
  .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 100; justify-content: center; align-items: flex-start; padding: 40px 20px; overflow: auto; }
  .modal.show { display: flex; }
  .modal-box { background: #fff; border-radius: 10px; width: 100%; max-width: 1000px; padding: 20px 22px 24px; box-shadow: 0 12px 34px rgba(0,0,0,.25); }
  .modal-head { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e5e9ee; padding-bottom: 10px; margin-bottom: 12px; }
  .modal-head h3 { margin: 0; font-size: 17px; }
  .modal-name { font-size: 14px; margin-bottom: 12px; display: flex; align-items: center; flex-wrap: wrap; gap: 14px; }
  .modal-name input[type="text"] { width: 130px; }
  .modal-name input[type="number"] { width: 80px; text-align: right; color: #c0392b; font-weight: 600; outline: none; }
  .week-head { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; font-size: 12px; color: #666; text-align: center; margin-bottom: 6px; margin-top: 8px; }
  .month-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .day-cell { border: 1px solid #dde3ea; border-radius: 6px; padding: 4px 4px 5px; min-height: 96px; display: flex; flex-direction: column; background: #fcfdfe; }
  .day-num { font-size: 11px; color: #7a8694; display: flex; justify-content: space-between; padding: 0 2px; margin-bottom: 4px; }
  .day-num .wd { color: #a9b3bd; }
  .half-row { display: flex; align-items: center; gap: 4px; margin-bottom: 3px; }
  .half-label { font-size: 11px; color: #9aa5b0; width: 16px; text-align: center; flex: 0 0 auto; font-weight: 600; }
  .half-label.ot { color: #b06a00; }
  .day-select { flex: 1; width: 100%; height: 26px; border: 1px solid #e5ecf3; border-radius: 4px; background-color: #fff; font-size: 12px; font-family: inherit; font-weight: 600; color: #222; text-align: center; text-align-last: center; cursor: pointer; outline: none; padding: 0 12px 0 2px; -webkit-appearance: none; appearance: none; background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 6'%3e%3cpath fill='%236b7783' d='M0 0l5 6 5-6z'/%3e%3c/svg%3e"); background-repeat: no-repeat; background-position: right 2px center; background-size: 6px 4px; }
  .day-select:focus { border-color: #1a73e8; box-shadow: 0 0 0 2px rgba(26,115,232,.18); background-color: #fffbe6; }
  .day-select.ot { color: #b06a00; background-color: #fffaf0; border-color: #f0dcb0; }
  .day-select[data-filled="true"] { background-color: #e8f0fe; border-color: #a8c5e8; color: #1a5fb4; }
  .day-select[data-filled="true"][data-rest="true"] { background-color: #f4f5f7; border-color: #dde3ea; color: #7a8694; font-weight: 500; }
  .day-cell.empty { border: none; background: transparent; }
  .salary-detail { margin-top: 18px; padding-top: 14px; border-top: 1px dashed #dde3ea; }
  .salary-detail h4 { margin: 0 0 10px; font-size: 15px; color: #1a5fb4; }
  table.salary-table { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.salary-table td { padding: 7px 10px; border-bottom: 1px solid #eef2f7; }
  table.salary-table td:nth-child(2), table.salary-table td:nth-child(3) { text-align: right; }
  table.salary-table tr.total-row td { border-top: 2px solid #1a73e8; border-bottom: none; font-weight: 700; color: #c0392b; font-size: 15px; padding-top: 10px; }
  .salary-detail .hint-line { font-size: 13px; color: #888; margin-bottom: 8px; line-height: 1.6; }
  .settings-section { padding: 14px 0; border-bottom: 1px solid #eef2f7; }
  .settings-section:last-child { border-bottom: none; }
  .settings-section h4 { margin: 0 0 10px; font-size: 15px; color: #1a5fb4; }
  .settings-section .desc { font-size: 13px; color: #888; margin-bottom: 10px; line-height: 1.7; }
  .settings-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 8px; }
  .settings-row input[type="text"], .settings-row input[type="password"] { width: 260px; }
  .status-line { font-size: 13px; margin-top: 6px; }
  .status-line.ok { color: #1e7e34; }
  .status-line.err { color: #c0392b; }
  .status-line.info { color: #1a5fb4; }
  .password-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 999; display: none; align-items: center; justify-content: center; }
  .password-overlay.show { display: flex; }
  .password-box { background: #fff; border-radius: 12px; padding: 32px 28px; max-width: 360px; width: 90%; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.4); }
  .password-box h3 { margin: 0 0 8px; font-size: 18px; }
  .password-box p { color: #888; font-size: 13px; margin: 0 0 18px; }
  .password-box input { width: 100%; padding: 10px 12px; border: 1px solid #bbb; border-radius: 6px; font-size: 15px; font-family: inherit; margin-bottom: 12px; outline: none; text-align: center; }
  .password-box input:focus { border-color: #1a73e8; box-shadow: 0 0 0 3px rgba(26,115,232,.18); }
  .password-box button { width: 100%; padding: 10px; font-size: 15px; }
  .form-field { margin-bottom: 14px; }
  .form-field label { display: block; font-size: 13px; color: #555; margin-bottom: 6px; font-weight: 600; }
  .form-field input { width: 100%; padding: 9px 11px; border: 1px solid #bbb; border-radius: 6px; font-size: 15px; font-family: inherit; outline: none; }
  .form-field input:focus { border-color: #1a73e8; box-shadow: 0 0 0 3px rgba(26,115,232,.18); }
  .form-actions { text-align: right; margin-top: 20px; }
  .form-actions button { padding: 9px 20px; font-size: 14px; }
  .form-actions button + button { margin-left: 8px; }

  @media print {
    @page { size: A3 landscape; margin: 8mm; }
    body { margin: 0; background: #fff; }
    .panel { box-shadow: none; padding: 0; border-radius: 0; max-width: none; }
    .no-print, .toolbar, .modal, .password-overlay { display: none !important; }
    .table-wrap { overflow: visible; }
    table.schedule { min-width: 100%; }
    th, td { border: 1px solid #000; font-size: 10px; padding: 2px; }
    .wage-input, .ot-input, .shift-select, .ot-select, .day-select { border: none !important; background: transparent !important; color: #000 !important; font-weight: 600; -webkit-appearance: none; appearance: none; background-image: none !important; }
  }
</style>
</head>
<body>

<!-- 密码遮罩 -->
<div class="password-overlay" id="passwordOverlay">
  <div class="password-box">
    <h3>🔒 请输入访问密码</h3>
    <p>该排班表已设置访问密码</p>
    <input type="password" id="passwordInput" placeholder="请输入密码" autocomplete="off">
    <button class="primary" onclick="submitPassword()">进 入</button>
    <p id="passwordError" style="color:#c0392b; margin-top:12px; display:none;">密码错误，请重新输入</p>
  </div>
</div>

<div class="panel" id="mainPanel">
  <h2 contenteditable="true">部门工作排班表</h2>

  <div class="info">
    <span><label>部门：</label><span contenteditable="true">综合部</span></span>
    <span><label>月份：</label><input type="month" id="monthPicker"></span>
    <span class="week-nav">
      <label>周次：</label>
      <button type="button" id="prevWeek">上一周</button>
      <select id="weekPicker"></select>
      <button type="button" id="nextWeek">下一周</button>
    </span>
    <span><label>制表人：</label><span contenteditable="true">张三</span></span>
  </div>

  <div class="table-wrap">
    <table class="schedule" id="scheduleTable">
      <thead>
        <tr id="dateRow1"></tr>
        <tr id="dateRow2"></tr>
      </thead>
      <tbody id="staffBody"></tbody>
    </table>
  </div>

  <div class="toolbar no-print">
    <button class="primary" onclick="openAddStaff()">＋ 添加员工</button>
    <button onclick="window.print()">🖨 打印</button>
    <button onclick="exportCSV()">📊 导出 Excel/CSV</button>
    <button onclick="exportPNG()">🖼 导出图片</button>
    <button onclick="openSettings()">⚙ 设置</button>
    <button onclick="clearAll()">🗑 清空</button>
  </div>
</div>

<!-- 员工整月弹窗 -->
<div class="modal" id="modal">
  <div class="modal-box">
    <div class="modal-head">
      <h3>员工整月班次与薪资</h3>
      <button onclick="closeModal()">关闭</button>
    </div>
    <div class="modal-name">
      <label>姓名：</label><input type="text" id="modalName">
      <label>上午单价：</label><input type="number" id="modalAmWage" min="0" step="1">
      <label>下午单价：</label><input type="number" id="modalPmWage" min="0" step="1">
      <label>加班单价：</label><input type="number" id="modalOtWage" min="0" step="1">
      <span style="color:#888;font-size:13px;">元（加班为元/小时）</span>
    </div>
    <div class="week-head">
      <div>周一</div><div>周二</div><div>周三</div><div>周四</div>
      <div>周五</div><div>周六</div><div>周日</div>
    </div>
    <div class="month-grid" id="monthGrid"></div>
    <div class="salary-detail" id="salaryDetail"></div>
  </div>
</div>

<!-- 设置弹窗 -->
<div class="modal" id="settingsModal">
  <div class="modal-box" style="max-width: 620px;">
    <div class="modal-head">
      <h3>设置</h3>
      <button onclick="closeSettings()">关闭</button>
    </div>
    <div class="settings-section">
      <h4>🔒 访问密码</h4>
      <div class="desc">设置后，打开此页面需要输入密码。密码只保存在本机浏览器，不同设备需分别设置。</div>
      <div class="settings-row">
        <input type="password" id="newPassword" placeholder="输入新密码（留空则取消密码）" autocomplete="off">
        <button onclick="savePassword()">保存密码</button>
      </div>
      <div id="pwdStatus" class="status-line"></div>
    </div>
    <div class="settings-section">
      <h4>💾 数据备份 / 恢复</h4>
      <div class="desc">导出全部月份的排班数据为 JSON 文件，或从 JSON 文件恢复。</div>
      <div class="settings-row">
        <button onclick="exportBackup()">导出全部数据</button>
        <button onclick="document.getElementById('importFile').click()">导入数据</button>
        <input type="file" id="importFile" accept=".json" style="display:none;" onchange="importBackup(event)">
      </div>
      <div id="backupStatus" class="status-line"></div>
    </div>
  </div>
</div>

<!-- 添加员工弹窗 -->
<div class="modal" id="addStaffModal">
  <div class="modal-box" style="max-width: 440px;">
    <div class="modal-head">
      <h3>➕ 添加员工</h3>
      <button onclick="closeAddStaff()">关闭</button>
    </div>
    <div class="form-field">
      <label>员工姓名</label>
      <input type="text" id="newStaffName" placeholder="例如：张三" autocomplete="off">
    </div>
    <div class="form-field">
      <label>上午单价（元/半天）</label>
      <input type="number" id="newStaffAm" value="80" min="0" step="1">
    </div>
    <div class="form-field">
      <label>下午单价（元/半天）</label>
      <input type="number" id="newStaffPm" value="70" min="0" step="1">
    </div>
    <div class="form-field">
      <label>加班单价（元/小时）</label>
      <input type="number" id="newStaffOt" value="20" min="0" step="1">
    </div>
    <div class="form-actions">
      <button onclick="closeAddStaff()">取消</button>
      <button class="primary" onclick="confirmAddStaff()">确定添加</button>
    </div>
  </div>
</div>

<!-- 通用确认弹窗 -->
<div class="modal" id="confirmModal">
  <div class="modal-box" style="max-width: 380px;">
    <div class="modal-head">
      <h3 id="confirmTitle">确认</h3>
      <button onclick="closeConfirm()">关闭</button>
    </div>
    <div id="confirmMessage" style="font-size:14px; color:#444; line-height:1.7; padding:6px 0 4px;"></div>
    <div class="form-actions">
      <button onclick="closeConfirm()">取消</button>
      <button class="danger" id="confirmOkBtn">确定</button>
    </div>
  </div>
</div>

<script>
/* ================= 常量 ================= */
const WEEK_FULL = ['周一','周二','周三','周四','周五','周六','周日'];
const WEEK_SHORT = ['一','二','三','四','五','六','日'];
const STORAGE_KEY = 'deptScheduleV15';
const PWD_KEY = 'deptSchedulePwd';
const SHIFT_OPTIONS = ['', 'C1', 'C2', '正常', 'A1', '休', '请假'];
const SHIFT_LABELS = { '': '—', 'C1': 'C1', 'C2': 'C2', '正常': '正常', 'A1': 'A1', '休': '休', '请假': '请假' };
const OT_OPTIONS = ['', '0.5', '1', '1.5', '2', '2.5', '3', '4'];

let state = loadState();
let currentStaffId = null;
const forcedSplitDays = new Set();

/* ================= 工具函数 ================= */
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

function currentMonthStr() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
}
function numOr(v, dft) {
  const n = Number(v);
  return isNaN(n) ? dft : n;
}
function normalizeStaff(s) {
  if (!s || typeof s !== 'object') s = {};
  if (!s.id) s.id = uid();
  if (!s.name) s.name = '新员工';
  if (!s.days || typeof s.days !== 'object') s.days = {};
  s.amWage = numOr(s.amWage, 80);
  s.pmWage = numOr(s.pmWage, 70);
  s.otWage = numOr(s.otWage, 20);
  return s;
}
function newStaffDefaults(name) {
  return normalizeStaff({
    id: uid(),
    name: name || '新员工',
    days: {},
    amWage: 80, pmWage: 70, otWage: 20
  });
}

/* ================= 加载 / 保存 ================= */
function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (parsed && typeof parsed === 'object') return migrate(parsed);
    }
  } catch (e) { console.warn('读取本地数据失败', e); }

  const m = currentMonthStr();
  const initialStaff = [newStaffDefaults('张三'), newStaffDefaults('李四'), newStaffDefaults('王五')];
  return {
    month: m,
    week: 0,
    monthsData: { [m]: { staff: initialStaff } },
    staff: initialStaff
  };
}

function migrate(s) {
  if (!s || typeof s !== 'object') s = {};
  if (!s.month) s.month = currentMonthStr();
  if (!s.monthsData || typeof s.monthsData !== 'object') s.monthsData = {};

  if (!s.monthsData[s.month] && Array.isArray(s.staff)) {
    s.monthsData[s.month] = { staff: s.staff };
  }
  if (!s.monthsData[s.month]) s.monthsData[s.month] = { staff: [] };
  if (!Array.isArray(s.monthsData[s.month].staff)) s.monthsData[s.month].staff = [];
  s.monthsData[s.month].staff = s.monthsData[s.month].staff.map(normalizeStaff);

  s.staff = s.monthsData[s.month].staff;
  if (typeof s.week !== 'number' || isNaN(s.week)) s.week = 0;
  return s;
}

function save() {
  try {
    if (!Array.isArray(state.staff)) state.staff = [];
    if (!state.monthsData || typeof state.monthsData !== 'object') state.monthsData = {};
    state.monthsData[state.month] = { staff: state.staff };
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      month: state.month,
      week: state.week,
      monthsData: state.monthsData
    }));
  } catch (e) { console.warn('保存本地数据失败', e); }
}

function switchMonth(newMonth) {
  if (!newMonth || newMonth === state.month) return;
  if (!Array.isArray(state.staff)) state.staff = [];
  const isNewMonth = !state.monthsData[newMonth];
  state.monthsData[state.month] = { staff: state.staff };
  const lastStaff = state.staff.slice();

  if (isNewMonth) {
    if (lastStaff.length > 0) {
      showConfirm(
        '新建月份',
        `「${newMonth}」还没有数据。是否复制上个月的员工名单（${lastStaff.length} 人）？<br>（只复制姓名和单价，不复制排班记录）`,
        '复制名单', '留空',
        () => {
          state.month = newMonth;
          state.monthsData[newMonth] = {
            staff: lastStaff.map(s => normalizeStaff({
              id: uid(), name: s.name, days: {},
              amWage: s.amWage, pmWage: s.pmWage, otWage: s.otWage
            }))
          };
          state.staff = state.monthsData[newMonth].staff;
          state.week = 0;
          save(); renderAll();
        },
        () => {
          state.month = newMonth;
          state.monthsData[newMonth] = { staff: [] };
          state.staff = [];
          state.week = 0;
          save(); renderAll();
        }
      );
      return;
    } else {
      state.monthsData[newMonth] = { staff: [] };
    }
  }

  state.month = newMonth;
  const bucket = state.monthsData[newMonth];
  if (!bucket || !Array.isArray(bucket.staff)) {
    state.monthsData[newMonth] = { staff: [] };
  }
  state.staff = state.monthsData[newMonth].staff;
  state.week = 0;
  save(); renderAll();
}

/* ================= 月份信息 ================= */
function getMonthInfo() {
  const [y, m] = state.month.split('-').map(Number);
  const daysInMonth = new Date(y, m, 0).getDate();
  const firstWeekday = new Date(y, m - 1, 1).getDay();
  const offset = (firstWeekday + 6) % 7;
  const totalWeeks = Math.ceil((offset + daysInMonth) / 7);
  return { y, m, daysInMonth, offset, totalWeeks };
}
function findStaff(id) {
  if (!Array.isArray(state.staff)) return null;
  return state.staff.find(s => String(s.id) === String(id));
}
function dateOfWeek(week, d) {
  const { daysInMonth, offset } = getMonthInfo();
  const date = week * 7 + d + 1 - offset;
  return (date >= 1 && date <= daysInMonth) ? date : 0;
}

/* ================= 格式化 ================= */
function formatDays(n) {
  const r = Math.round(n * 100) / 100;
  return Number.isInteger(r) ? String(r) : r.toFixed(2).replace(/\.?0+$/, '');
}
function formatMoney(n) {
  const r = Math.round(n * 100) / 100;
  return Number.isInteger(r) ? String(r) : r.toFixed(2);
}
function isRestValue(v) { return v && (v.indexOf('休') !== -1 || v.indexOf('假') !== -1); }
function isPresent(v) {
  if (!v) return false;
  const s = String(v).trim();
  return s && !isRestValue(s);
}
function parseOT(value) {
  if (value === undefined || value === null) return 0;
  const v = String(value).trim();
  if (!v || isRestValue(v)) return 0;
  const n = Number(v);
  return (isNaN(n) || n < 0) ? 0 : Math.round(n * 100) / 100;
}

/* ================= 确认弹窗 ================= */
function showConfirm(title, htmlMessage, okText, cancelText, onOk, onCancel) {
  document.getElementById('confirmTitle').textContent = title || '确认';
  document.getElementById('confirmMessage').innerHTML = htmlMessage || '';
  const okBtn = document.getElementById('confirmOkBtn');
  const newOk = okBtn.cloneNode(true);
  okBtn.parentNode.replaceChild(newOk, okBtn);
  newOk.textContent = okText || '确定';
  newOk.addEventListener('click', () => {
    closeConfirm();
    if (typeof onOk === 'function') onOk();
  });
  const cancelBtns = document.querySelectorAll('#confirmModal .form-actions button:not(.danger)');
  cancelBtns.forEach(b => {
    const newB = b.cloneNode(true);
    b.parentNode.replaceChild(newB, b);
    newB.textContent = cancelText || '取消';
    newB.addEventListener('click', () => {
      closeConfirm();
      if (typeof onCancel === 'function') onCancel();
    });
  });
  document.getElementById('confirmModal').classList.add('show');
}
function closeConfirm() { document.getElementById('confirmModal').classList.remove('show'); }
document.getElementById('confirmModal').addEventListener('click', e => { if (e.target.id === 'confirmModal') closeConfirm(); });

/* ================= 薪资 ================= */
function calcSalary(staff) {
  let amCount = 0, pmCount = 0, otHours = 0;
  const map = (staff && staff.days) || {};
  Object.keys(map).forEach(key => {
    const v = map[key];
    if (key.endsWith('-ot')) otHours += parseOT(v);
    else if (key.endsWith('-am')) { if (isPresent(v)) amCount++; }
    else if (key.endsWith('-pm')) { if (isPresent(v)) pmCount++; }
  });
  otHours = Math.round(otHours * 100) / 100;
  const amWage = Number(staff.amWage) || 0;
  const pmWage = Number(staff.pmWage) || 0;
  const otWage = Number(staff.otWage) || 0;
  const amAmt = Math.round(amCount * amWage * 100) / 100;
  const pmAmt = Math.round(pmCount * pmWage * 100) / 100;
  const otAmt = Math.round(otHours * otWage * 100) / 100;
  const total = Math.round((amAmt + pmAmt + otAmt) * 100) / 100;
  return { amCount, pmCount, otHours, amWage, pmWage, otWage, amAmt, pmAmt, otAmt, total, days: (amCount + pmCount) / 2 };
}

/* ================= 下拉选项 ================= */
function fillShiftOptions(sel, currentValue, includeSplit) {
  SHIFT_OPTIONS.forEach(opt => {
    const o = document.createElement('option');
    o.value = opt;
    o.textContent = SHIFT_LABELS[opt] || opt;
    sel.appendChild(o);
  });
  if (includeSplit) {
    const sep = document.createElement('option');
    sep.disabled = true;
    sep.textContent = '─────';
    sel.appendChild(sep);
    const sp = document.createElement('option');
    sp.value = '__split__';
    sp.textContent = '分开填写…';
    sel.appendChild(sp);
  }
  if (currentValue && SHIFT_OPTIONS.indexOf(currentValue) === -1) {
    const o = document.createElement('option');
    o.value = currentValue;
    o.textContent = currentValue;
    sel.appendChild(o);
  }
  sel.value = currentValue || '';
}
function fillOTOptions(sel, currentValue) {
  OT_OPTIONS.forEach(opt => {
    const o = document.createElement('option');
    o.value = opt;
    o.textContent = opt === '' ? '—' : opt + 'h';
    sel.appendChild(o);
  });
  if (currentValue && OT_OPTIONS.indexOf(currentValue) === -1) {
    const o = document.createElement('option');
    o.value = currentValue;
    o.textContent = currentValue + 'h';
    sel.appendChild(o);
  }
  sel.value = currentValue || '';
}
function applyShiftSelectStyle(sel, value) {
  if (value) sel.setAttribute('data-filled', 'true'); else sel.removeAttribute('data-filled');
  if (isRestValue(value)) sel.setAttribute('data-rest', 'true'); else sel.removeAttribute('data-rest');
}

/* ================= 主表渲染 ================= */
function renderShiftCell(s, date) {
  const td = document.createElement('td');
  td.className = 'shift-cell';
  td.dataset.staffId = s.id;
  td.dataset.date = String(date);
  const amVal = s.days[date + '-am'] || '';
  const pmVal = s.days[date + '-pm'] || '';
  const splitKey = s.id + '-' + date;
  const forcedSplit = forcedSplitDays.has(splitKey);
  const canMerge = !forcedSplit && amVal === pmVal;
  if (canMerge) {
    const sel = document.createElement('select');
    sel.className = 'shift-select';
    sel.dataset.role = 'all';
    sel.dataset.staffId = s.id;
    sel.dataset.date = String(date);
    fillShiftOptions(sel, amVal, true);
    applyShiftSelectStyle(sel, amVal);
    td.appendChild(sel);
  } else {
    const wrap = document.createElement('div');
    wrap.className = 'shift-split';
    ['am', 'pm'].forEach(part => {
      const row = document.createElement('div');
      row.className = 'shift-half-row';
      const label = document.createElement('span');
      label.className = 'shift-half-label';
      label.textContent = part === 'am' ? '上' : '下';
      const sel = document.createElement('select');
      sel.className = 'shift-select half';
      sel.dataset.role = part;
      sel.dataset.staffId = s.id;
      sel.dataset.date = String(date);
      const val = s.days[date + '-' + part] || '';
      fillShiftOptions(sel, val, false);
      applyShiftSelectStyle(sel, val);
      row.appendChild(label);
      row.appendChild(sel);
      wrap.appendChild(row);
    });
    td.appendChild(wrap);
  }
  return td;
}
function renderOTCell(s, date) {
  const td = document.createElement('td');
  td.className = 'ot-cell';
  const sel = document.createElement('select');
  sel.className = 'ot-select';
  sel.dataset.role = 'ot';
  sel.dataset.staffId = s.id;
  sel.dataset.date = String(date);
  fillOTOptions(sel, s.days[date + '-ot'] || '');
  td.appendChild(sel);
  return td;
}
function renderWeekPicker() {
  const { totalWeeks } = getMonthInfo();
  const sel = document.getElementById('weekPicker');
  sel.innerHTML = '';
  for (let w = 0; w < totalWeeks; w++) {
    let start = 1, end = 1;
    for (let d = 0; d < 7; d++) { const x = dateOfWeek(w, d); if (x) { start = x; break; } }
    for (let d = 6; d >= 0; d--) { const x = dateOfWeek(w, d); if (x) { end = x; break; } }
    const opt = document.createElement('option');
    opt.value = w;
    opt.textContent = `第${w + 1}周（${start}日 - ${end}日）`;
    sel.appendChild(opt);
  }
  if (state.week < 0) state.week = 0;
  if (state.week >= totalWeeks) state.week = totalWeeks - 1;
  sel.value = state.week;
}

  const row2 = document.getElementById('dateRow2');

  row2.innerHTML = '';

  row1.appendChild(pmTh);
  const otTh = document.createElement('th');
  otTh.className = 'ot-wage-col'; otTh.rowSpan = 2;

  for (let d = 0; d < 7; d++) {

    row1.appendChild(dayTh);
    const s1 = document.createElement('th'); s1.className = 'shift-col'; s1.textContent = '班次'; row2.appendChild(s1);
    const s2 = document.createElement('th'); s2.className = 'ot-col'; s2.textContent = '加班'; row2.appendChild(s2);
  }
  const salTh = document.createElement('th');
  salTh.className = 'salary-col'; salTh.rowSpan = 2; salTh.textContent = '本月薪资';
  row1.appendChild(salTh);
  const opTh = document.createElement('th');
  opTh.className = 'op-col no-print'; opTh.rowSpan = 2; opTh.textContent = '操作';
  row1.appendChild(opTh);
}
function makeWageTd(staffId, part, value, tip, cls) {
  const td = document.createElement('td');
  td.className = part === 'ot' ? 'ot-wage-col' : (part === 'am' ? 'am-wage-col' : 'pm-wage-col');
  const input = document.createElement('input');
  input.type = 'number'; input.min = '0'; input.step = '1';
  input.className = cls;
  input.dataset.staffId = staffId;
  input.dataset.wagePart = part;
  input.value = value;
  input.title = tip;
  td.appendChild(input);
  return td;
}
function renderBody() {
  if (!Array.isArray(state.staff)) state.staff = [];
  const tbody = document.getElementById('staffBody');
  tbody.innerHTML = '';
  state.staff.forEach(s => {
    normalizeStaff(s);
    const tr = document.createElement('tr');
    const nameTd = document.createElement('td');
    nameTd.className = 'name-col';
    const nameSpan = document.createElement('span');
    nameSpan.className = 'staff-name';
    nameSpan.dataset.staffId = s.id;
    nameSpan.title = '点击查看整月班次和薪资';
    nameSpan.textContent = s.name;
    nameSpan.addEventListener('click', () => openModal(s.id));
    nameTd.appendChild(nameSpan);
    tr.appendChild(nameTd);
    tr.appendChild(makeWageTd(s.id, 'am', s.amWage, '上午半天工资', 'wage-input'));
    tr.appendChild(makeWageTd(s.id, 'pm', s.pmWage, '下午半天工资', 'wage-input'));
    tr.appendChild(makeWageTd(s.id, 'ot', s.otWage, '加班每小时工资', 'ot-input'));
    for (let d = 0; d < 7; d++) {
      const date = dateOfWeek(state.week, d);
      if (date > 0) {
        tr.appendChild(renderShiftCell(s, date));
        tr.appendChild(renderOTCell(s, date));
      } else {
        const t1 = document.createElement('td'); t1.className = 'shift-col out'; tr.appendChild(t1);
        const t2 = document.createElement('td'); t2.className = 'ot-col out'; tr.appendChild(t2);
      }
    }
    const salaryTd = document.createElement('td');
    salaryTd.className = 'salary-col';
    const { total } = calcSalary(s);
    if (total > 0) salaryTd.innerHTML = `<span class="salary-val" data-staff-id="${s.id}">¥${formatMoney(total)}</span>`;
    else salaryTd.innerHTML = `<span class="salary-val empty" data-staff-id="${s.id}">—</span>`;
    tr.appendChild(salaryTd);
    const opTd = document.createElement('td');
    opTd.className = 'op-col no-print';
    const delBtn = document.createElement('button');
    delBtn.className = 'btn-del';
    delBtn.textContent = '删除';
    delBtn.addEventListener('click', () => deleteStaff(s.id));
    opTd.appendChild(delBtn);
    tr.appendChild(opTd);
    tbody.appendChild(tr);
  });
}
function renderAll() {
  if (!Array.isArray(state.staff)) state.staff = [];
  renderWeekPicker();
  renderHeader();
  renderBody();
  document.getElementById('monthPicker').value = state.month;
}
function updateSalaryCell(staffId) {
  const s = findStaff(staffId);
  if (!s) return;
  const { total } = calcSalary(s);
  const cell = document.querySelector(`.salary-val[data-staff-id="${s.id}"]`);
  if (!cell) return;
  if (total > 0) {
    cell.textContent = '¥' + formatMoney(total);
    cell.classList.remove('empty');
  } else {
    cell.textContent = '—';
    cell.classList.add('empty');
  }
}
function rerenderShiftCell(staffId, date) {
  const s = findStaff(staffId);
  if (!s) return;
  const oldTd = document.querySelector(`#staffBody td.shift-cell[data-staff-id="${staffId}"][data-date="${date}"]`);
  if (oldTd) oldTd.replaceWith(renderShiftCell(s, date));
}

/* ================= 写入数据 ================= */
function setDayField(staffId, date, part, value) {
  const s = findStaff(staffId);
  if (!s) return;
  const key = date + '-' + part;
  if (!s.days) s.days = {};
  if (value) s.days[key] = value;
  else delete s.days[key];
  save();
}
function syncModalCell(staffId) {
  if (String(currentStaffId) !== String(staffId)) return;
  const s = findStaff(staffId);
  if (!s) return;
  renderMonthGrid(s);
  renderSalaryDetail(s);
}

/* ================= 主表事件 ================= */
document.getElementById('staffBody').addEventListener('change', e => {
  const sel = e.target;
  if (!sel.matches('select[data-role]')) return;
  const staffId = sel.dataset.staffId;
  const date = sel.dataset.date;
  const role = sel.dataset.role;
  const value = sel.value;
  const splitKey = staffId + '-' + date;
  if (value === '__split__') {
    forcedSplitDays.add(splitKey);
    rerenderShiftCell(staffId, date);
    return;
  }
  if (role === 'all') {
    setDayField(staffId, date, 'am', value);
    setDayField(staffId, date, 'pm', value);
    applyShiftSelectStyle(sel, value);
  } else if (role === 'am' || role === 'pm') {
    setDayField(staffId, date, role, value);
    applyShiftSelectStyle(sel, value);
    const s = findStaff(staffId);
    if (s && (s.days[date + '-am'] || '') === (s.days[date + '-pm'] || '')) {
      forcedSplitDays.delete(splitKey);
      rerenderShiftCell(staffId, date);
    }
  } else if (role === 'ot') {
    setDayField(staffId, date, 'ot', value);
  }
  updateSalaryCell(staffId);
  syncModalCell(staffId);
});
document.getElementById('staffBody').addEventListener('input', e => {
  const input = e.target.closest ? e.target.closest('.wage-input, .ot-input') : null;
  if (!input) return;
  const s = findStaff(input.dataset.staffId);
  if (!s) return;
  const part = input.dataset.wagePart;
  const val = Math.max(0, Number(input.value) || 0);
  if (part === 'am') s.amWage = val;
  else if (part === 'pm') s.pmWage = val;
  else if (part === 'ot') s.otWage = val;
  save();
  updateSalaryCell(s.id);
  if (String(currentStaffId) === String(s.id)) {
    syncModalWageInputs(s);
    renderSalaryDetail(s);
  }
});

/* ================= 员工月视图弹窗 ================= */
function openModal(staffId) {
  const s = findStaff(staffId);
  if (!s) return;
  normalizeStaff(s);
  currentStaffId = s.id;
  document.getElementById('modalName').value = s.name;
  syncModalWageInputs(s);
  renderMonthGrid(s);
  renderSalaryDetail(s);
  document.getElementById('modal').classList.add('show');
}
function closeModal() {
  document.getElementById('modal').classList.remove('show');
  currentStaffId = null;
}
function syncModalWageInputs(s) {
  document.getElementById('modalAmWage').value = s.amWage;
  document.getElementById('modalPmWage').value = s.pmWage;
  document.getElementById('modalOtWage').value = s.otWage;
}
function renderMonthGrid(s) {
  const { y, m, daysInMonth, offset } = getMonthInfo();
  const grid = document.getElementById('monthGrid');
  grid.innerHTML = '';
  for (let i = 0; i < offset; i++) {
    const ph = document.createElement('div');
    ph.className = 'day-cell empty';
    grid.appendChild(ph);
  }
  for (let d = 1; d <= daysInMonth; d++) {
    const wd = (new Date(y, m - 1, d).getDay() + 6) % 7;
    const cell = document.createElement('div');
    cell.className = 'day-cell';
    const num = document.createElement('div');
    num.className = 'day-num';
    num.innerHTML = `<span>${d}日</span><span class="wd">${WEEK_SHORT[wd]}</span>`;
    cell.appendChild(num);
    const amVal = s.days[d + '-am'] || '';
    const pmVal = s.days[d + '-pm'] || '';
    const splitKey = s.id + '-' + d;
    const forcedSplit = forcedSplitDays.has(splitKey);
    const canMerge = !forcedSplit && amVal === pmVal;
    if (canMerge) {
      const row = document.createElement('div');
      row.className = 'half-row';
      const label = document.createElement('span');
      label.className = 'half-label';
      label.textContent = '班';
      const sel = document.createElement('select');
      sel.className = 'day-select';
      sel.dataset.key = d + '-all';
      sel.dataset.role = 'all';
      fillShiftOptions(sel, amVal, true);
      applyShiftSelectStyle(sel, amVal);
      row.appendChild(label);
      row.appendChild(sel);
      cell.appendChild(row);
    } else {
      ['am', 'pm'].forEach(part => {
        const row = document.createElement('div');
        row.className = 'half-row';
        const label = document.createElement('span');
        label.className = 'half-label';
        label.textContent = part === 'am' ? '上' : '下';
        const sel = document.createElement('select');
        sel.className = 'day-select';
        sel.dataset.key = d + '-' + part;
        sel.dataset.role = part;
        const val = s.days[d + '-' + part] || '';
        fillShiftOptions(sel, val, false);
        applyShiftSelectStyle(sel, val);
        row.appendChild(label);
        row.appendChild(sel);
        cell.appendChild(row);
      });
    }
    const otRow = document.createElement('div');
    otRow.className = 'half-row';
    const otLabel = document.createElement('span');
    otLabel.className = 'half-label ot';
    otLabel.textContent = '加';
    const otSel = document.createElement('select');
    otSel.className = 'day-select ot';
    otSel.dataset.key = d + '-ot';
    otSel.dataset.role = 'ot';
    fillOTOptions(otSel, s.days[d + '-ot'] || '');
    otRow.appendChild(otLabel);
    otRow.appendChild(otSel);
    cell.appendChild(otRow);
    grid.appendChild(cell);
  }
}
function renderSalaryDetail(s) {
  const r = calcSalary(s);
  let html = '<h4>本月薪资明细</h4>';
  html += '<div class="hint-line">上午次数 × 上午单价 + 下午次数 × 下午单价 + 加班小时 × 加班单价。</div>';
  html += '<table class="salary-table">';
  html += `<tr><td>上午出勤</td><td>${r.amCount} 次</td><td>× ¥${formatMoney(r.amWage)} = ¥${formatMoney(r.amAmt)}</td></tr>`;
  html += `<tr><td>下午出勤</td><td>${r.pmCount} 次</td><td>× ¥${formatMoney(r.pmWage)} = ¥${formatMoney(r.pmAmt)}</td></tr>`;
  html += `<tr><td>加班时长</td><td>${formatDays(r.otHours)} 小时</td><td>× ¥${formatMoney(r.otWage)} = ¥${formatMoney(r.otAmt)}</td></tr>`;
  html += `<tr><td>折合天数</td><td>${formatDays(r.days)} 天</td><td></td></tr>`;
  html += `<tr class="total-row"><td>本月合计</td><td>¥${formatMoney(r.total)}</td><td></td></tr>`;
  html += '</table>';
  document.getElementById('salaryDetail').innerHTML = html;
}
document.getElementById('monthGrid').addEventListener('change', e => {
  const sel = e.target.closest ? e.target.closest('select[data-role]') : null;
  if (!sel || !currentStaffId) return;
  const s = findStaff(currentStaffId);
  if (!s) return;
  const role = sel.dataset.role;
  const key = sel.dataset.key;
  const parts = key.split('-');
  const date = parts[0];
  const splitKey = s.id + '-' + date;
  const value = sel.value;
  if (value === '__split__') {
    forcedSplitDays.add(splitKey);
    renderMonthGrid(s);
    rerenderShiftCell(s.id, date);
    return;
  }
  if (role === 'all') {
    setDayField(s.id, date, 'am', value);
    setDayField(s.id, date, 'pm', value);
  } else if (role === 'am' || role === 'pm') {
    setDayField(s.id, date, role, value);
  } else if (role === 'ot') {
    setDayField(s.id, date, 'ot', value);
  }
  const amVal = s.days[date + '-am'] || '';
  const pmVal = s.days[date + '-pm'] || '';
  if (role !== 'ot' && amVal === pmVal) forcedSplitDays.delete(splitKey);
  renderMonthGrid(s);
  rerenderShiftCell(s.id, date);
  renderSalaryDetail(s);
  updateSalaryCell(s.id);
});
document.getElementById('modalName').addEventListener('input', e => {
  const s = findStaff(currentStaffId);
  if (!s) return;
  s.name = e.target.value;
  save();
  const el = document.querySelector(`.staff-name[data-staff-id="${s.id}"]`);
  if (el) el.textContent = s.name;
});
function bindModalWage(inputId, field, part) {
  document.getElementById(inputId).addEventListener('input', e => {
    const s = findStaff(currentStaffId);
    if (!s) return;
    const val = Math.max(0, Number(e.target.value) || 0);
    s[field] = val;
    save();
    const input = document.querySelector(`.wage-input[data-staff-id="${s.id}"][data-wage-part="${part}"],.ot-input[data-staff-id="${s.id}"][data-wage-part="${part}"]`);
    if (input) input.value = val;
    renderSalaryDetail(s);
    updateSalaryCell(s.id);
  });
}
bindModalWage('modalAmWage', 'amWage', 'am');
bindModalWage('modalPmWage', 'pmWage', 'pm');
bindModalWage('modalOtWage', 'otWage', 'ot');
document.getElementById('modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    closeModal(); closeSettings(); closeAddStaff(); closeConfirm();
  }
});

/* ================= 添加员工 ================= */
function openAddStaff() {
  document.getElementById('newStaffName').value = '';
  document.getElementById('newStaffAm').value = 80;
  document.getElementById('newStaffPm').value = 70;
  document.getElementById('newStaffOt').value = 20;
  document.getElementById('addStaffModal').classList.add('show');
  setTimeout(() => { try { document.getElementById('newStaffName').focus(); } catch (e) {} }, 120);
}
function closeAddStaff() {
  document.getElementById('addStaffModal').classList.remove('show');
}
function confirmAddStaff() {
  try {
    if (!Array.isArray(state.staff)) state.staff = [];
    const name = (document.getElementById('newStaffName').value || '').trim();
    if (!name) {
      document.getElementById('newStaffName').focus();
      return;
    }
    const am = Math.max(0, Number(document.getElementById('newStaffAm').value) || 0);
    const pm = Math.max(0, Number(document.getElementById('newStaffPm').value) || 0);
    const ot = Math.max(0, Number(document.getElementById('newStaffOt').value) || 0);
    const s = newStaffDefaults(name);
    s.amWage = am; s.pmWage = pm; s.otWage = ot;
    state.staff.push(s);
    if (!state.monthsData || typeof state.monthsData !== 'object') state.monthsData = {};
    state.monthsData[state.month] = { staff: state.staff };
    save();
    renderBody();
    closeAddStaff();
  } catch (err) {
    console.error('添加员工失败', err);
    alert('添加员工失败：' + err.message);
  }
}
document.getElementById('addStaffModal').addEventListener('click', e => {
  if (e.target.id === 'addStaffModal') closeAddStaff();
});
document.getElementById('newStaffName').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('newStaffAm').focus();
});
document.getElementById('newStaffAm').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('newStaffPm').focus();
});
document.getElementById('newStaffPm').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('newStaffOt').focus();
});
document.getElementById('newStaffOt').addEventListener('keydown', e => {
  if (e.key === 'Enter') confirmAddStaff();
});

/* ================= 删除 / 清空 ================= */
function deleteStaff(id) {
  const s = findStaff(id);
  if (!s) return;
  showConfirm('删除员工', `确定删除「<b>${s.name}</b>」及其整月排班数据吗？<br>此操作不可恢复。`, '确定删除', '取消', () => {
    state.staff = state.staff.filter(x => String(x.id) !== String(id));
    save();
    Array.from(forcedSplitDays).forEach(k => {
      if (k.startsWith(String(id) + '-')) forcedSplitDays.delete(k);
    });
    renderBody();
    if (String(currentStaffId) === String(id)) closeModal();
  });
}
function clearAll() {
  showConfirm('清空数据', '确定清空<b>当前月份</b>全部员工和排班数据吗？<br>此操作不可恢复。', '确定清空', '取消', () => {
    state.staff = [];
    state.monthsData[state.month] = { staff: [] };
    state.week = 0;
    forcedSplitDays.clear();
    save();
    renderAll();
  });
}

/* ================= 月份 / 周次 ================= */
document.getElementById('monthPicker').addEventListener('change', e => {
  switchMonth(e.target.value || currentMonthStr());
});
document.getElementById('weekPicker').addEventListener('change', e => {
  state.week = Number(e.target.value) || 0;
  save();
  renderHeader();
  renderBody();
});
document.getElementById('prevWeek').addEventListener('click', () => {
  if (state.week > 0) { state.week -= 1; save(); renderAll(); }
});
document.getElementById('nextWeek').addEventListener('click', () => {
  const { totalWeeks } = getMonthInfo();
  if (state.week < totalWeeks - 1) { state.week += 1; save(); renderAll(); }
});

/* ================= 导出 CSV ================= */
function exportCSV() {
  try {
    if (!Array.isArray(state.staff)) state.staff = [];
    const info = getMonthInfo();
    const days = info.daysInMonth;
    const rows = [];
    const header = ['员工姓名', '上午单价', '下午单价', '加班单价'];
    for (let d = 1; d <= days; d++) header.push(d + '日');
    header.push('本月薪资');
    rows.push(header);
    state.staff.forEach(s => {
      const row = [s.name, s.amWage, s.pmWage, s.otWage];
      for (let d = 1; d <= days; d++) {
        const am = s.days[d + '-am'] || '';
        const pm = s.days[d + '-pm'] || '';
        const ot = s.days[d + '-ot'] || '';
        let cell = '';
        if (am && pm) cell = (am === pm) ? am : '上:' + am + ' 下:' + pm;
        else if (am) cell = '上:' + am;
        else if (pm) cell = '下:' + pm;
        if (ot) cell = (cell ? cell + ' ' : '') + '加班' + ot + 'h';
        row.push(cell);
      }
      row.push(calcSalary(s).total);
      rows.push(row);
    });
    const csv = rows.map(r => r.map(cell => {
      const s = String(cell == null ? '' : cell);
      if (s.indexOf(',') !== -1 || s.indexOf('"') !== -1 || s.indexOf('\n') !== -1) {
        return '"' + s.replace(/"/g, '""') + '"';
      }
      return s;
    }).join(',')).join('\r\n');
    downloadBlob(new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' }), `排班表_${state.month}.csv`);
  } catch (err) {
    console.error(err);
    alert('导出失败：' + err.message);
  }
}
function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* ================= 导出 PNG ================= */
function exportPNG() {
  if (typeof html2canvas === 'undefined') {
    alert('图片导出库未加载，请检查网络后刷新页面。');
    return;
  }
  const panel = document.getElementById('mainPanel');
  const btn = event && event.target;
  const oldText = btn ? btn.textContent : '';
  if (btn) { btn.textContent = '生成中…'; btn.disabled = true; }
  html2canvas(panel, {
    scale: 2, backgroundColor: '#ffffff', useCORS: true, logging: false,
    windowWidth: panel.scrollWidth, windowHeight: panel.scrollHeight
  }).then(canvas => {
    canvas.toBlob(blob => {
      downloadBlob(blob, `排班表_${state.month}.png`);
      if (btn) { btn.textContent = oldText; btn.disabled = false; }
    }, 'image/png');
  }).catch(err => {
    console.error(err);
    alert('图片生成失败：' + err.message);
    if (btn) { btn.textContent = oldText; btn.disabled = false; }
  });
}

/* ================= 密码 ================= */
function getStoredPwd() {
  try { return localStorage.getItem(PWD_KEY); } catch (e) { return null; }
}
function checkPasswordGate() {
  const pwd = getStoredPwd();
  if (!pwd) return true;
  document.getElementById('passwordOverlay').classList.add('show');
  setTimeout(() => document.getElementById('passwordInput').focus(), 100);
  return false;
}
function submitPassword() {
  const pwd = getStoredPwd();
  const input = document.getElementById('passwordInput').value;
  if (input === pwd) {
    document.getElementById('passwordOverlay').classList.remove('show');
    document.getElementById('passwordError').style.display = 'none';
    document.getElementById('passwordInput').value = '';
  } else {
    document.getElementById('passwordError').style.display = 'block';
    document.getElementById('passwordInput').value = '';
    document.getElementById('passwordInput').focus();
  }
}
document.getElementById('passwordInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') submitPassword();
});
function savePassword() {
  const v = document.getElementById('newPassword').value;
  const status = document.getElementById('pwdStatus');
  try {
    if (v) {
      localStorage.setItem(PWD_KEY, v);
      status.textContent = '✅ 密码已设置，下次打开需要输入。';
      status.className = 'status-line ok';
    } else {
      localStorage.removeItem(PWD_KEY);
      status.textContent = '✅ 密码已取消，打开不再需要密码。';
      status.className = 'status-line ok';
    }
    document.getElementById('newPassword').value = '';
  } catch (e) {
    status.textContent = '❌ 保存失败：' + e.message;
    status.className = 'status-line err';
  }
}

/* ================= 设置 ================= */
function openSettings() {
  document.getElementById('pwdStatus').textContent = getStoredPwd() ? '当前已设置密码' : '当前未设置密码';
  document.getElementById('pwdStatus').className = 'status-line info';
  document.getElementById('settingsModal').classList.add('show');
}
function closeSettings() {
  document.getElementById('settingsModal').classList.remove('show');
}
document.getElementById('settingsModal').addEventListener('click', e => {
  if (e.target.id === 'settingsModal') closeSettings();
});

/* ================= 备份 / 恢复 ================= */
function exportBackup() {
  const data = {
    month: state.month,
    week: state.week,
    monthsData: state.monthsData,
    exportedAt: new Date().toISOString()
  };
  downloadBlob(
    new Blob([JSON.stringify(data, null, 2)], { type: 'application/json;charset=utf-8' }),
    `排班表备份_${new Date().toISOString().slice(0, 10)}.json`
  );
  const st = document.getElementById('backupStatus');
  st.textContent = '✅ 备份已下载';
  st.className = 'status-line ok';
}
function importBackup(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      if (!data.monthsData) throw new Error('文件格式不正确');
      showConfirm('导入数据', '导入将<b>覆盖</b>当前全部数据，确定吗？', '确定导入', '取消', () => {
        state.monthsData = data.monthsData;
        state.month = data.month || currentMonthStr();
        state.week = data.week || 0;
        if (!state.monthsData[state.month]) state.monthsData[state.month] = { staff: [] };
        if (!Array.isArray(state.monthsData[state.month].staff)) state.monthsData[state.month].staff = [];
        state.monthsData[state.month].staff = state.monthsData[state.month].staff.map(normalizeStaff);
        state.staff = state.monthsData[state.month].staff;
        save();
        renderAll();
        const st = document.getElementById('backupStatus');
        st.textContent = '✅ 导入成功';
        st.className = 'status-line ok';
      });
    } catch (err) {
      const st = document.getElementById('backupStatus');
      st.textContent = '❌ 导入失败：' + err.message;
      st.className = 'status-line err';
    }
    event.target.value = '';
  };
  reader.readAsText(file);
}

/* ================= 启动 ================= */
document.getElementById('monthPicker').value = state.month;
renderAll();
checkPasswordGate();
</script>
